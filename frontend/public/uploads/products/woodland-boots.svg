<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#d97706" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#d97706" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">OUTDOOR RUGGED</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(150, 160)">
    <!-- Deep Lugged Commando Tread Sole -->
    <path d="M 20,165 L 290,165 L 285,195 L 20,195 Z" fill="#18181b" />
    <!-- Tread teeth -->
    <g fill="#27272a">
      <rect x="35" y="195" width="20" height="8" /><rect x="75" y="195" width="20" height="8" />
      <rect x="115" y="195" width="20" height="8" /><rect x="155" y="195" width="20" height="8" />
      <rect x="195" y="195" width="20" height="8" /><rect x="235" y="195" width="20" height="8" />
    </g>
    <!-- Oiled Camel Nubuck Upper -->
    <path d="M 20,165 Q 50,110 110,105 L 140,30 L 210,35 L 220,110 Q 260,125 290,165 Z" fill="#d97706" stroke="#92400e" stroke-width="2.5" />
    <!-- Padded Collar at Ankle -->
    <rect x="140" y="25" width="70" height="18" rx="6" fill="#451a03" />
    <!-- Hex Metal Eyelets and Cord Laces -->
    <g fill="#ca8a04">
      <circle cx="145" cy="65" r="4" /><circle cx="148" cy="85" r="4" /><circle cx="150" cy="105" r="4" />
      <circle cx="180" cy="65" r="4" /><circle cx="182" cy="85" r="4" /><circle cx="185" cy="105" r="4" />
    </g>
    <!-- Tree Logo Emboss -->
    <circle cx="80" cy="135" r="14" fill="#92400e" opacity="0.6" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Woodland Camel Nubuck Trekking Boots</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Heavy-Duty Nubuck Leather • Deep Commando Lug Sole • All-Terrain</text>
  </g>
</svg>