<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="24" />
  <circle cx="300" cy="270" r="220" fill="url(#spotlight)" />

  <!-- Soft Grounding Shadow -->
  <ellipse cx="300" cy="430" rx="170" ry="18" fill="#0f172a" opacity="0.1" filter="url(#dropShadow)" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="-74" cy="0" r="4" fill="#ca8a04" />
    <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="1.5">CLASSIC AVIATOR</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(140, 190)">
    <!-- Aviator Teardrop Shape -->
    <path d="M 30,25 Q 85,20 140,25 Q 150,95 85,100 Q 25,95 30,25 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="3" />
    <path d="M 180,25 Q 235,20 290,25 Q 295,95 235,100 Q 170,95 180,25 Z" fill="#0f172a" stroke="#ca8a04" stroke-width="3" />
    <line x1="140" y1="25" x2="180" y2="25" stroke="#ca8a04" stroke-width="3" />
    <line x1="135" y1="18" x2="185" y2="18" stroke="#ca8a04" stroke-width="2" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.3">Polarized Aviator Sunglasses UV400</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">Grade 5 Titanium • Tri-Acetate Polarized • Glare Eliminator</text>
  </g>
</svg>