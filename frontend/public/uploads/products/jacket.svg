<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="24" />
  <circle cx="300" cy="270" r="220" fill="url(#spotlight)" />

  <!-- Soft Grounding Shadow -->
  <ellipse cx="300" cy="430" rx="170" ry="18" fill="#0f172a" opacity="0.1" filter="url(#dropShadow)" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="-74" cy="0" r="4" fill="#0284c7" />
    <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="1.5">ALL-WEATHER GEAR</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(170, 130)">
    <path d="M 90,30 L 170,30 L 240,75 L 215,130 L 180,115 L 180,260 L 80,260 L 80,115 L 45,130 L 20,75 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="130" y1="30" x2="130" y2="260" stroke="#0f172a" stroke-width="3" />
    <rect x="95" y="110" width="20" height="35" rx="3" fill="#0369a1" />
    <rect x="145" y="110" width="20" height="35" rx="3" fill="#0369a1" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.3">All-Weather Waterproof Shell Jacket</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">Triple-Layer GORE Membrane • 20,000mm Waterproof • Sealed Seams</text>
  </g>
</svg>