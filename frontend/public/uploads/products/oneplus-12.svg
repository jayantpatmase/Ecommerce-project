<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#10b981" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">FLAGSHIP PERFORMANCE</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(215, 115)">
    <!-- Emerald Green Glass Back -->
    <defs>
      <linearGradient id="opGreen" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064e3b" />
        <stop offset="50%" stop-color="#047857" />
        <stop offset="100%" stop-color="#022c22" />
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="170" height="310" rx="28" fill="url(#opGreen)" stroke="#34d399" stroke-width="2" />
    <!-- Hasselblad Giant Circular Camera Island -->
    <g transform="translate(85, 90)">
      <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#cbd5e1" stroke-width="2.5" />
      <circle cx="0" cy="0" r="50" fill="#1e293b" />
      <!-- Lenses -->
      <circle cx="-20" cy="-18" r="14" fill="#020617" stroke="#64748b" stroke-width="2" />
      <circle cx="-20" cy="-18" r="7" fill="#1e293b" />
      <circle cx="20" cy="-18" r="14" fill="#020617" stroke="#64748b" stroke-width="2" />
      <circle cx="20" cy="-18" r="7" fill="#1e293b" />
      <rect x="-18" y="8" width="36" height="24" rx="4" fill="#020617" stroke="#64748b" stroke-width="1.5" />
      <!-- Hasselblad H Logo in center -->
      <text x="0" y="2" font-family="serif" font-size="14" font-weight="900" fill="#f87171" text-anchor="middle">H</text>
    </g>
    <!-- OnePlus 1+ Logo at bottom -->
    <rect x="73" y="240" width="24" height="24" rx="4" fill="#ef4444" />
    <text x="85" y="257" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">1+</text>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">OnePlus 12 5G (Flowy Emerald)</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Snapdragon 8 Gen 3 • 4th Gen Hasselblad • 100W SuperVOOC</text>
  </g>
</svg>