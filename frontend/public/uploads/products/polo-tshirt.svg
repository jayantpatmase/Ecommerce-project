<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#ef4444" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">PREMIUM CASUAL</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(160, 130)">
    <defs>
      <linearGradient id="poloBlue" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e3a8a" />
        <stop offset="100%" stop-color="#0f172a" />
      </linearGradient>
    </defs>
    <!-- Polo Shirt Silhouette -->
    <path d="M 90,30 L 190,30 L 260,75 L 235,130 L 200,115 L 200,260 L 80,260 L 80,115 L 45,130 L 20,75 Z" fill="url(#poloBlue)" stroke="#3b82f6" stroke-width="2" />
    <!-- Ribbed Collar -->
    <polygon points="90,30 140,65 110,95 80,50" fill="#172554" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="190,30 140,65 170,95 200,50" fill="#172554" stroke="#60a5fa" stroke-width="1.5" />
    <!-- 2-Button Placket -->
    <rect x="130" y="65" width="20" height="50" rx="3" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="140" cy="80" r="3" fill="#ffffff" />
    <circle cx="140" cy="100" r="3" fill="#ffffff" />
    <!-- USPA Embroidered Double Horseman Logo -->
    <circle cx="175" cy="115" r="7" fill="#dc2626" />
    <text x="175" y="118" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">P</text>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">U.S. Polo Assn. Cotton Pique Polo</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">100% Combed Cotton • Breathable Pique Knit • Regular Fit</text>
  </g>
</svg>