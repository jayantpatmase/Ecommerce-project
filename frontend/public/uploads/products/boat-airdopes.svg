<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#ef4444" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">BESTSELLING EARBUDS</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <!-- Open Pebble Charging Case -->
  <g transform="translate(200, 140)">
    <!-- Case Lower Body -->
    <rect x="20" y="80" width="160" height="120" rx="45" fill="#18181b" stroke="#3f3f46" stroke-width="2.5" />
    <!-- boAt Emblem in center -->
    <path d="M 90,140 L 100,122 L 110,140 Z" fill="#ef4444" />
    <!-- 4 Battery LED Indicator Dots -->
    <g transform="translate(75, 170)">
      <circle cx="0" cy="0" r="3" fill="#22c55e" />
      <circle cx="16" cy="0" r="3" fill="#22c55e" />
      <circle cx="32" cy="0" r="3" fill="#22c55e" />
      <circle cx="48" cy="0" r="3" fill="#22c55e" />
    </g>
    <!-- Twin Earbuds protruding out -->
    <!-- Left Bud -->
    <g transform="translate(45, 10)">
      <ellipse cx="16" cy="20" rx="16" ry="18" fill="#27272a" stroke="#71717a" stroke-width="1.5" />
      <rect x="12" y="34" width="8" height="42" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#ef4444" />
    </g>
    <!-- Right Bud -->
    <g transform="translate(125, 10)">
      <ellipse cx="16" cy="20" rx="16" ry="18" fill="#27272a" stroke="#71717a" stroke-width="1.5" />
      <rect x="12" y="34" width="8" height="42" rx="4" fill="#27272a" stroke="#52525b" stroke-width="1" />
      <circle cx="16" cy="20" r="4" fill="#ef4444" />
    </g>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">boAt Airdopes 141 ANC</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Active Noise Cancellation 32dB • 42H Total Playtime • BEAST Mode</text>
  </g>
</svg>