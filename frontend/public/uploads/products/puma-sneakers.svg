<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#16a34a" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#16a34a" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">TIMELESS CLASSIC</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(150, 180)">
    <!-- Vulcanized Rubber Sole -->
    <rect x="20" y="140" width="270" height="25" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Clean White Leather Upper -->
    <path d="M 20,140 Q 60,65 140,65 Q 230,70 280,120 L 290,140 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
    <!-- Suede Green Formstrip -->
    <path d="M 70,120 Q 150,135 240,85 Q 260,95 220,135 Q 140,140 70,120 Z" fill="#15803d" />
    <!-- Gold PUMA Wordmark -->
    <text x="120" y="95" font-family="sans-serif" font-size="10" font-weight="900" fill="#ca8a04">PUMA</text>
    <!-- Lacing Eyelets -->
    <line x1="110" y1="75" x2="170" y2="75" stroke="#e2e8f0" stroke-width="3" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Puma Smashic Casual Retro Sneakers</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">SoftFoam+ Optimal Insole • Classic Suede Formstrip • White / Green</text>
  </g>
</svg>