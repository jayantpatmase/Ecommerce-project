<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#16a34a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#16a34a" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#16a34a" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">FINANCIAL MASTERCLASS</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(185, 110)">
    <!-- Book Spine -->
    <polygon points="20,20 35,5 35,275 20,290" fill="#15803d" stroke="#166534" stroke-width="1.5" />
    <!-- Front Cover -->
    <rect x="35" y="5" width="190" height="270" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
    <!-- Classical Greek Coin / Currency Seal -->
    <circle cx="130" cy="95" r="32" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="130" y="103" font-family="serif" font-size="24" font-weight="900" fill="#15803d" text-anchor="middle">₹</text>
    <!-- Titles -->
    <text x="130" y="155" font-family="serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">THE PSYCHOLOGY</text>
    <text x="130" y="175" font-family="serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">OF</text>
    <text x="130" y="202" font-family="serif" font-size="26" font-weight="900" fill="#15803d" text-anchor="middle">MONEY</text>
    <line x1="80" y1="216" x2="180" y2="216" stroke="#22c55e" stroke-width="1.5" />
    <text x="130" y="235" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b" text-anchor="middle">MORGAN HOUSEL</text>
    <text x="130" y="255" font-family="sans-serif" font-size="8" font-weight="500" fill="#64748b" text-anchor="middle">Timeless Lessons on Wealth, Greed &amp; Happiness</text>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">The Psychology of Money</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Timeless Lessons on Wealth &amp; Happiness • Morgan Housel</text>
  </g>
</svg>