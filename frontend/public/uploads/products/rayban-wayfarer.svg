<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#10b981" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">ICONIC SUNWEAR</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(130, 190)">
    <!-- Left Lens Frame -->
    <path d="M 30,20 Q 90,15 150,25 Q 140,90 90,95 Q 35,90 30,20 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <!-- Left Polarized G-15 Green Tint Lens with Glare Reflection -->
    <path d="M 38,28 Q 90,23 142,32 Q 134,84 90,88 Q 42,84 38,28 Z" fill="#064e3b" opacity="0.9" />
    <polygon points="50,35 110,35 90,75 40,75" fill="#34d399" opacity="0.25" />
    <text x="50" y="44" font-family="serif" font-size="7" font-weight="900" fill="#ffffff" opacity="0.8">Ray-Ban</text>
    <circle cx="36" cy="24" r="2.5" fill="#cbd5e1" />

    <!-- Center Bridge -->
    <path d="M 150,25 Q 170,18 190,25" fill="none" stroke="#0f172a" stroke-width="8" />

    <!-- Right Lens Frame -->
    <path d="M 190,25 Q 250,15 310,20 Q 305,90 250,95 Q 200,90 190,25 Z" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
    <!-- Right Polarized Lens -->
    <path d="M 198,32 Q 250,23 302,28 Q 298,84 250,88 Q 206,84 198,32 Z" fill="#064e3b" opacity="0.9" />
    <polygon points="210,35 270,35 250,75 200,75" fill="#34d399" opacity="0.25" />
    <circle cx="304" cy="24" r="2.5" fill="#cbd5e1" />

    <!-- Temples reaching back -->
    <path d="M 28,24 L 2,6" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <path d="M 312,24 L 338,6" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Ray-Ban Classic Wayfarer RB2140</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Iconic Black Acetate • G-15 Polarized Crystal Lenses • 100% UV400</text>
  </g>
</svg>