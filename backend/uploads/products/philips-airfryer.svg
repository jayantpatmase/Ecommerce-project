<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#22c55e" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">HEALTHY COOKING</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(190, 120)">
    <!-- Gloss Black Main Appliance Body -->
    <rect x="10" y="20" width="200" height="260" rx="35" fill="#18181b" stroke="#3f3f46" stroke-width="2.5" />
    <!-- Top Slanted Digital Touch Panel -->
    <rect x="25" y="35" width="170" height="80" rx="16" fill="#09090b" stroke="#52525b" stroke-width="1.5" />
    <!-- LED Display Glowing Temp & Time -->
    <text x="110" y="70" font-family="monospace" font-size="24" font-weight="900" fill="#22c55e" text-anchor="middle">180°C</text>
    <text x="110" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#a1a1aa" text-anchor="middle">20 MIN • RAPID AIR</text>
    <!-- Preset Touch Icons -->
    <circle cx="50" cy="65" r="5" fill="#f59e0b" /><circle cx="170" cy="65" r="5" fill="#3b82f6" />
    <!-- Basket Seam Divider -->
    <line x1="10" y1="135" x2="210" y2="135" stroke="#27272a" stroke-width="3" />
    <!-- Chrome Pull Handle -->
    <rect x="90" y="160" width="40" height="85" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
    <rect x="98" y="172" width="24" height="60" rx="8" fill="#18181b" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Philips Digital Air Fryer HD9252</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Rapid Air Technology 4.1L • 7 Touch Presets • 90% Less Oil</text>
  </g>
</svg>