<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#38bdf8" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">GALAXY AI FLAGSHIP</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <!-- S24 Ultra Phone Body -->
  <g transform="translate(200, 110)">
    <!-- Titanium Frame -->
    <rect x="0" y="0" width="170" height="310" rx="10" fill="#475569" stroke="#94a3b8" stroke-width="2.5" />
    <!-- Inner Screen Bezel -->
    <rect x="5" y="5" width="160" height="300" rx="6" fill="#020617" />
    <!-- Dynamic AMOLED Screen with Galaxy AI Wallpaper Glow -->
    <defs>
      <linearGradient id="s24Wall" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="45%" stop-color="#818cf8" />
        <stop offset="70%" stop-color="#c084fc" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>
    </defs>
    <rect x="7" y="7" width="156" height="296" rx="4" fill="url(#s24Wall)" opacity="0.85" />
    <!-- Top Infinity-O Camera Cutout -->
    <circle cx="85" cy="18" r="3.5" fill="#000000" />
    <!-- Screen UI Elements -->
    <text x="85" y="80" font-family="sans-serif" font-size="28" font-weight="300" fill="#ffffff" text-anchor="middle">10:08</text>
    <text x="85" y="98" font-family="sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.9">Tue, 24 Oct • 28°C</text>
    <!-- Galaxy AI Star Emblem in Center -->
    <g transform="translate(85, 175) scale(0.9)">
      <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#ffffff" opacity="0.95" />
      <polygon points="14,-14 16,-8 22,-6 16,-4 14,2 12,-4 6,-6 12,-8" fill="#fde047" />
    </g>
    <text x="85" y="215" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Galaxy AI</text>
  </g>
  <!-- S-Pen Stylus Alongside -->
  <g transform="translate(390, 160)">
    <rect x="0" y="0" width="12" height="230" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
    <!-- S Pen Clicker Top -->
    <rect x="1" y="0" width="10" height="20" rx="3" fill="#cbd5e1" />
    <!-- S Pen Button -->
    <rect x="2" y="80" width="8" height="22" rx="3" fill="#64748b" />
    <!-- Fine Tip -->
    <polygon points="0,225 12,225 6,245" fill="#0f172a" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Samsung Galaxy S24 Ultra 5G</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Snapdragon 8 Gen 3 • 200MP Quad Camera • S Pen</text>
  </g>
</svg>