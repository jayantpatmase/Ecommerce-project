<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#8b5cf6" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">APPLE SILICON M3</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <!-- Open Laptop Clamshell Profile -->
  <g transform="translate(130, 150)">
    <!-- Display Lid -->
    <rect x="40" y="0" width="260" height="175" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <!-- Bezel -->
    <rect x="46" y="6" width="248" height="163" rx="4" fill="#020617" />
    <!-- Retina Screen with macOS Wallpaper -->
    <defs>
      <linearGradient id="macWall" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="35%" stop-color="#8b5cf6" />
        <stop offset="70%" stop-color="#ec4899" />
        <stop offset="100%" stop-color="#f97316" />
      </linearGradient>
    </defs>
    <rect x="49" y="9" width="242" height="157" fill="url(#macWall)" />
    <!-- Camera Notch -->
    <rect x="160" y="9" width="20" height="6" rx="2" fill="#020617" />
    <!-- Base Lower Chassis (Perspective) -->
    <polygon points="0,205 340,205 320,175 20,175" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Keyboard Well -->
    <polygon points="50,195 290,195 280,180 60,180" fill="#0f172a" />
    <!-- Trackpad -->
    <rect x="135" y="196" width="70" height="8" rx="2" fill="#1e293b" stroke="#64748b" stroke-width="0.8" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Apple MacBook Air 15" M3</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Apple M3 Chip • 15.3" Liquid Retina • 18h Battery</text>
  </g>
</svg>