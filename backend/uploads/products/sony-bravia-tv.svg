<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#eab308" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">CINEMATIC 4K HDR</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(120, 130)">
    <!-- Thin Bezel Frame -->
    <rect x="0" y="0" width="360" height="225" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="3" />
    <!-- 4K HDR Screen with Aurora Mountain Scenic Art -->
    <defs>
      <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="40%" stop-color="#065f46" />
        <stop offset="70%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#1e1b4b" />
      </linearGradient>
    </defs>
    <rect x="6" y="6" width="348" height="213" fill="url(#auroraSky)" />
    <!-- Mountains silhouette -->
    <polygon points="30,190 110,120 180,190" fill="#0f172a" />
    <polygon points="140,190 220,100 310,190" fill="#020617" />
    <!-- Sony Logo & 4K HDR badge -->
    <text x="180" y="212" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SONY</text>
    <rect x="290" y="18" width="48" height="18" rx="3" fill="#000000" fill-opacity="0.75" />
    <text x="314" y="31" font-family="sans-serif" font-size="9" font-weight="800" fill="#fbbf24" text-anchor="middle">4K HDR</text>
    <!-- Dual Stand Metal Feet -->
    <polygon points="55,225 65,225 50,250 40,250" fill="#94a3b8" />
    <polygon points="305,225 295,225 310,250 320,250" fill="#94a3b8" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Sony Bravia 55" 4K Google TV</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Dolby Vision & Atmos • 4K Processor X1 • Google TV</text>
  </g>
</svg>