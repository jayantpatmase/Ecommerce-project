<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#eab308" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">GLOBAL BESTSELLER</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(185, 110)">
    <!-- 3D Hardcover Book Perspective Spine -->
    <polygon points="20,20 35,5 35,275 20,290" fill="#ca8a04" stroke="#a16207" stroke-width="1.5" />
    <!-- Front Cover -->
    <rect x="35" y="5" width="190" height="270" rx="4" fill="#fafafa" stroke="#e2e8f0" stroke-width="2" />
    <!-- Title Constellation Motif -->
    <circle cx="130" cy="100" r="38" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" />
    <circle cx="130" cy="100" r="22" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,2" />
    <circle cx="130" cy="100" r="8" fill="#ca8a04" />
    <!-- Bestseller Banner -->
    <rect x="50" y="24" width="160" height="16" rx="8" fill="#fef08a" />
    <text x="130" y="35" font-family="sans-serif" font-size="8" font-weight="800" fill="#854d0e" text-anchor="middle">OVER 15 MILLION COPIES SOLD</text>
    <!-- Book Title & Author -->
    <text x="130" y="165" font-family="serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">ATOMIC</text>
    <text x="130" y="190" font-family="serif" font-size="22" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">HABITS</text>
    <line x1="85" y1="202" x2="175" y2="202" stroke="#eab308" stroke-width="2" />
    <text x="130" y="222" font-family="sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">JAMES CLEAR</text>
    <text x="130" y="245" font-family="sans-serif" font-size="7" font-weight="600" fill="#94a3b8" text-anchor="middle">Tiny Changes, Remarkable Results</text>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Atomic Habits by James Clear</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Tiny Changes, Remarkable Results • International #1 Bestseller</text>
  </g>
</svg>