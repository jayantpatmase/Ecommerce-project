<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#a855f7" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">PRECISION ENGINEERING</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(180, 110)">
    <!-- Cyclone Motor Head (Copper / Nickel finish) -->
    <rect x="40" y="20" width="80" height="90" rx="14" fill="#d97706" stroke="#f59e0b" stroke-width="2" />
    <!-- Clear Bin with Radial Cyclones inside -->
    <rect x="45" y="30" width="70" height="60" rx="8" fill="#18181b" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="80" cy="60" r="18" fill="#f59e0b" opacity="0.8" />
    <!-- Ergonomic Trigger Handle -->
    <path d="M 40,60 L 0,80 L 10,120 L 40,100 Z" fill="#3f3f46" stroke="#71717a" stroke-width="1.5" />
    <circle cx="20" cy="90" r="5" fill="#ef4444" />
    <!-- Slim Wand Extension (Purple/Gold) -->
    <rect x="74" y="110" width="12" height="150" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="1.5" />
    <!-- Laser Fluffy Cleaner Head -->
    <rect x="40" y="260" width="80" height="24" rx="6" fill="#10b981" stroke="#34d399" stroke-width="2" />
    <!-- Green Laser Beam Glow projection -->
    <polygon points="120,265 200,285 200,295 120,275" fill="#22c55e" opacity="0.4" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Dyson V12 Detect Slim Cordless</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Laser Dust Detection • 150 AW Suction • Piezo Particle Sensor</text>
  </g>
</svg>