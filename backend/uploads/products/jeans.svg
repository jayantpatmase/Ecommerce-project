<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Clean Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="24" />
  <circle cx="300" cy="270" r="220" fill="url(#spotlight)" />

  <!-- Soft Grounding Shadow -->
  <ellipse cx="300" cy="430" rx="170" ry="18" fill="#0f172a" opacity="0.1" filter="url(#dropShadow)" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
    <circle cx="-74" cy="0" r="4" fill="#2563eb" />
    <text x="-60" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" letter-spacing="1.5">DENIM ESSENTIAL</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(200, 120)">
    <path d="M 20,20 L 180,20 L 190,80 L 175,270 L 115,270 L 100,120 L 85,270 L 25,270 L 10,80 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2" />
    <rect x="18" y="20" width="164" height="20" fill="#172554" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" />
    <line x1="100" y1="40" x2="100" y2="105" stroke="#d97706" stroke-width="2" stroke-dasharray="3,2" />
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.3">Organic Cotton Slim Denim Jeans</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">98% Cotton 2% Elastane • Selvedge Stretch • Vintage Indigo</text>
  </g>
</svg>