<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="spotlight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Studio Stage Background -->
  <rect width="600" height="600" fill="url(#bgGlow)" rx="28" />
  <circle cx="300" cy="270" r="230" fill="url(#spotlight)" />

  <!-- Podium / Grounding Surface -->
  <ellipse cx="300" cy="425" rx="200" ry="24" fill="#000000" opacity="0.5" filter="url(#dropShadow)" />
  <ellipse cx="300" cy="420" rx="160" ry="14" fill="url(#podiumGrad)" opacity="0.6" />

  <!-- Top Badge -->
  <g transform="translate(300, 48)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-68" cy="0" r="4" fill="#38bdf8" />
    <text x="-54" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" letter-spacing="1.5">HI-RES AUDIO CERTIFIED</text>
  </g>

  <!-- Main Product Illustration Artwork -->
  <g id="productArtwork" filter="url(#dropShadow)">

  <g transform="translate(180, 120)">
    <!-- Headband Arc -->
    <path d="M 40,160 C 40,30 200,30 200,160" fill="none" stroke="#e2e8f0" stroke-width="16" stroke-linecap="round" />
    <path d="M 60,110 C 60,60 180,60 180,110" fill="none" stroke="#cbd5e1" stroke-width="6" />
    <!-- Left Earcup Assembly -->
    <g transform="translate(10, 140)">
      <rect x="18" y="0" width="8" height="30" rx="4" fill="#94a3b8" />
      <ellipse cx="22" cy="55" rx="32" ry="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <ellipse cx="22" cy="55" rx="20" ry="32" fill="#e2e8f0" />
      <circle cx="22" cy="55" r="4" fill="#64748b" />
    </g>
    <!-- Right Earcup Assembly -->
    <g transform="translate(190, 140)">
      <rect x="14" y="0" width="8" height="30" rx="4" fill="#94a3b8" />
      <ellipse cx="18" cy="55" rx="32" ry="46" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <ellipse cx="18" cy="55" rx="20" ry="32" fill="#e2e8f0" />
      <circle cx="18" cy="55" r="4" fill="#64748b" />
    </g>
  </g>

  </g>

  <!-- Bottom Details Typography -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.3">Sony WH-1000XM5 ANC Headphones</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Industry-Leading Active Noise Cancelling • LDAC • 30h Battery</text>
  </g>
</svg>